// ZenFX optional startup loader. The first line must remain a comment.
(() => {
  "use strict";
  if (globalThis.ZenfxStartupLoader) return;
  const { classes: classes, interfaces: interfaces } = Components;
  const dirs = classes["@mozilla.org/file/directory_service;1"].getService(interfaces.nsIProperties);
  const profileChrome = dirs.get("UChrm", interfaces.nsIFile);
  const managed = profileChrome.clone(); managed.append("zenfx-installed");
  const marker = managed.clone(); marker.append("enabled.json");
  if (!marker.exists() || classes["@mozilla.org/xre/app-info;1"].getService(interfaces.nsIXULRuntime).inSafeMode) return;
  const manifest = managed.clone(); manifest.append("chrome.manifest");
  if (!manifest.exists()) return;
  Components.manager.QueryInterface(interfaces.nsIComponentRegistrar).autoRegister(manifest);
  const observerService = classes["@mozilla.org/observer-service;1"].getService(interfaces.nsIObserverService);
  const scripts = classes["@mozilla.org/moz/jssubscript-loader;1"].getService(interfaces.mozIJSSubScriptLoader);
  const loaded = new WeakSet();
  function applyToWindow(win) {
    if (loaded.has(win) || win.closed || win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
    if (!win.Services.prefs.getBoolPref("zenfx.enabled", true)) return;
    // Only a profile explicitly containing the managed files runs these hooks.
    for (const name of ["zenfx-newtab-overlay.uc.js", "zenfx-drag-to-split.uc.js", "zenfx-compact-toggle.uc.js"]) {
      const file = managed.clone(); file.append(name);
      if (file.exists()) scripts.loadSubScript("chrome://zenfx/content/" + name, win, "UTF-8");
    }
    loaded.add(win);
  }
  const observer = { observe(subject) { try { applyToWindow(subject); } catch (error) { Components.utils.reportError(error); } } };
  observerService.addObserver(observer, "browser-delayed-startup-finished");
  globalThis.ZenfxStartupLoader = {
    applyToWindow,
    uninstall() { observerService.removeObserver(observer, "browser-delayed-startup-finished"); delete globalThis.ZenfxStartupLoader; },
  };
})();
